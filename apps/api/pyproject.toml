[project]
name = "issuebot"
version = "0.1.0"
description = "Evidence-first GitHub issue investigations grounded in a DocsGPT knowledge base."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "httpx>=0.28.1",
  "cryptography>=44.0.0",
  "PyJWT>=2.10.1",
  "psycopg[binary]>=3.2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["issuebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=issuebot --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["issuebot", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
packages = ["issuebot"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true

[tool.coverage.run]
branch = true
omit = ["tests/*", "alembic/*"]
