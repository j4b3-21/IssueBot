services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: issuebot
      POSTGRES_PASSWORD: ${ISSUEBOT_DB_PASSWORD:-change-me}
      POSTGRES_DB: issuebot
    volumes:
      - issuebot-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuebot -d issuebot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      ISSUEBOT_DATABASE_URL: postgresql+psycopg://issuebot:${ISSUEBOT_DB_PASSWORD:-change-me}@postgres:5432/issuebot
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  issuebot-pg:
